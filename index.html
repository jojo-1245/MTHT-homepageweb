<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaHint - Floating Navbar</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Noto Sans", sans-serif;
        background-color: #f3f3ff;
      }

      @media (min-width: 768px) and (max-width: 950px) {
        .nav-link {
          padding-left: 0.6rem !important;
          padding-right: 0.6rem !important;
          font-size: 0.875rem !important;
        }

        .logo-responsive {
          width: 7rem !important;
        }

        .white-paper-btn {
          padding-left: 0.75rem !important;
          padding-right: 0.75rem !important;
          font-size: 0.875rem !important;
        }
      }

      .floating-navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        background-color: #f3f3ff;

      }

      .content-with-floating-navbar {
        padding-top: 80px;
      }

      #mobile-menu {
        display: none;
        flex-direction: column;
      }
    </style>
  </head>
  <body class="bg-[#F3F3FF]" style="height: 200vh">
    <!-- Floating Navbar -->
    <header class="floating-navbar">
      <div
        class="max-w-screen-xl mx-auto px-4 sm:px-6 py-4 md:py-6 flex justify-between items-center"
      >
        <div class="text-2xl font-bold text-indigo-600">
          <img
            src="./assets/images/logo_metahint_text.png"
            alt="Metahint"
            class="logo-responsive w-24 md:w-32 lg:w-40 z-10"
          />
        </div>
        <nav
          id="navbar"
          class="hidden md:flex space-x-1 lg:space-x-2 xl:space-x-6 font-medium"
        >
          <a
            href="#"
            class="nav-link text-[#5E62AC] py-3 px-3 lg:px-4 xl:px-6 rounded-xl font-semibold bg-white"
            >Home</a
          >
          <a href="#" class="nav-link py-3 px-3 lg:px-4 xl:px-6 rounded-xl"
            >About</a
          >
          <a href="#" class="nav-link py-3 px-3 lg:px-4 xl:px-6 rounded-xl"
            >Key Services</a
          >
          <a href="#" class="nav-link py-3 px-3 lg:px-4 xl:px-6 rounded-xl"
            >Tokenomics</a
          >
          <a href="#" class="nav-link py-3 px-3 lg:px-4 xl:px-6 rounded-xl"
            >Roadmap</a
          >
        </nav>

        <a
          href="#"
          class="white-paper-btn font-medium hidden md:inline-block px-3 lg:px-4 xl:px-4 py-2 border border-[#5E62AC] rounded-lg text-[#5E62AC] hover:bg-[#5E62AC] hover:text-white transition"
        >
          White Paper
        </a>
        <!-- Mobile Menu Button -->
        <button id="menu-btn" class="md:hidden text-gray-700 text-2xl">
          ☰
        </button>
      </div>

      <!-- Mobile Dropdown -->
      <div
        id="mobile-menu"
        class="hidden bg-white border-t border-gray-200 md:hidden flex flex-col px-6 py-4 space-y-3"
      >
        <a href="#" class="hover:text-indigo-600 py-2">Home</a>
        <a href="#" class="hover:text-indigo-600 py-2">About</a>
        <a href="#" class="hover:text-indigo-600 py-2">Key Services</a>
        <a href="#" class="hover:text-indigo-600 py-2">Tokenomics</a>
        <a href="#" class="hover:text-indigo-600 py-2">Roadmap</a>
        <a
          href="#"
          class="px-4 py-2 border border-indigo-600 rounded-lg text-indigo-600 hover:bg-indigo-600 hover:text-white transition inline-block text-center mt-2"
        >
          White Paper
        </a>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="py-12 md:py-20 content-with-floating-navbar mt-28">
      <div
        class="max-w-screen-xl mx-auto px-4 sm:px-6 grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 items-center"
      >
        <!-- Left Content -->
        <div class="text-center md:text-left">
          <h1
            class="text-4xl md:text-5xl lg:text-6xl font-bold leading-tight pb-2 bg-gradient-to-br from-[#5c60a9] to-[#313257] bg-clip-text text-transparent"
          >
            AI & Blockchain for <br />
            <span>Digital Health Trust</span>
          </h1>
          <p class="mt-4 text-[#5E62AC] font-medium text-base md:text-xl">
            Personal Data Sovereignty, Real-World Health Utility
          </p>
          <div class="mt-6">
            <a
              href="#"
              class="px-6 py-3 bg-[#5E62AC] text-white rounded-lg shadow hover:bg-indigo-700 transition inline-block"
            >
              App Download
            </a>
          </div>
        </div>

        <!-- Right Content -->
        <div
          class="relative flex justify-center md:justify-end order-first md:order-last"
        >
          <!-- Bot -->
          <img
            src="./assets/images/image_robot.png"
            alt="Bot Illustration"
            class="h-[490px] z-10"
          />
        </div>
      </div>
    </section>

    <!-- Sponsor Section -->
    <section class="py-12 bg-white">
      <div class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8">
        <div
          class="grid grid-cols-2 md:grid-cols-3 gap-6 items-center justify-items-center"
        >
          <img
            src="./assets/images/icon_sponsor.png"
            alt="Sponsor"
            class="h-10 md:h-12"
          />
          <img
            src="./assets/images/icon_sponsor.png"
            alt="Sponsor"
            class="h-10 md:h-12"
          />
          <img
            src="./assets/images/icon_sponsor.png"
            alt="Sponsor"
            class="h-10 md:h-12"
          />
        </div>
      </div>
    </section>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              notosans: ['"Noto Sans"', "sans-serif"],
            },
          },
        },
      };

      $("#menu-btn").click(function () {
        $("#mobile-menu").slideToggle(200, function () {
          if ($(this).is(":visible")) {
            $(this).css("display", "flex");
          }
        });
      });

      $("#navbar .nav-link").click(function (e) {
        e.preventDefault();
        $("#navbar .nav-link").removeClass("text-[#5E62AC]");
        $("#navbar .nav-link").removeClass("bg-white");
        $("#navbar .nav-link").removeClass("font-semibold");
        $(this).addClass("text-[#5E62AC]");
        $(this).addClass("bg-white");
        $(this).addClass("font-semibold");
      });
    </script>
  </body>
</html>
