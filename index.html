<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meta Hiilt</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body class="bg-white font-sans">
    <!-- Navbar -->
    <header class="bg-white shadow-sm">
      <div
        class="max-w-screen-xl mx-auto px-6 py-4 flex justify-between items-center"
      >
        <div class="text-2xl font-bold text-indigo-600">META HiiLT</div>
        <nav class="hidden md:flex space-x-6 text-gray-700 font-medium">
          <a href="#" class="hover:text-indigo-600">Home</a>
          <a href="#" class="hover:text-indigo-600">About</a>
          <a href="#" class="hover:text-indigo-600">Key Services</a>
          <a href="#" class="hover:text-indigo-600">Tokenomics</a>
          <a href="#" class="hover:text-indigo-600">Roadmap</a>
        </nav>
        <a
          href="#"
          class="hidden md:inline-block px-4 py-2 border border-indigo-600 rounded-lg text-indigo-600 hover:bg-indigo-600 hover:text-white transition"
        >
          White Paper
        </a>
        <!-- Mobile Menu Button -->
        <button id="menu-btn" class="md:hidden text-gray-700 text-2xl">
          ☰
        </button>
      </div>

      <!-- Mobile Dropdown -->
      <div
        id="mobile-menu"
        class="hidden bg-white border-t border-gray-200 md:hidden flex flex-col px-6 py-4 space-y-3"
      >
        <a href="#" class="hover:text-indigo-600">Home</a>
        <a href="#" class="hover:text-indigo-600">About</a>
        <a href="#" class="hover:text-indigo-600">Key Services</a>
        <a href="#" class="hover:text-indigo-600">Tokenomics</a>
        <a href="#" class="hover:text-indigo-600">Roadmap</a>
        <a
          href="#"
          class="px-4 py-2 border border-indigo-600 rounded-lg text-indigo-600 hover:bg-indigo-600 hover:text-white transition"
        >
          White Paper
        </a>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-white py-16">
      <div
        class="max-w-screen-xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-12 items-center"
      >
        <!-- Left Content -->
        <div class="text-center md:text-left">
          <h1
            class="text-3xl md:text-5xl font-bold leading-tight text-gray-900"
          >
            AI & Blockchain for <br />
            <span class="text-indigo-600">Digital Health Trust</span>
          </h1>
          <p class="mt-4 text-gray-600 text-lg">
            Personal Data Sovereignty, Real-World Health Utility
          </p>
          <div class="mt-6">
            <a
              href="#"
              class="px-6 py-3 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700 transition"
            >
              App Download
            </a>
          </div>
        </div>

        <!-- Right Content -->
        <div class="relative flex justify-center md:justify-end">
          <!-- Bot -->
          <img
            src="bot.png"
            alt="Bot Illustration"
            class="w-40 md:w-52 lg:w-64 z-10"
          />
          <!-- Phone -->
          <img
            src="phone.png"
            alt="Phone Mockup"
            class="absolute top-12 md:top-16 lg:top-20 w-52 md:w-64 lg:w-72"
          />
        </div>
      </div>
    </section>

    <script>

      $("#menu-btn").click(function () {
        $("#mobile-menu").slideToggle();
      });
    </script>
  </body>
</html>
