<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaHint</title>

    <link rel="stylesheet" href="./styles/main.css" />
    <link
      rel="icon"
      href="./assets/images/logo_metahint_image.png"
      type="image/png"
      sizes="32x32"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F3F3FF] font-notosans">
    <!-- Navbar -->
    <header class="">
      <div
        class="max-w-screen-xl mx-auto px-6 py-6 flex justify-between items-center"
      >
        <div class="text-2xl font-bold text-indigo-600">
          <img
            src="./assets/images/logo_metahint_text.png"
            alt="Metahint"
            class="w-26 md:w-34 lg:w-40 z-10"
          />
        </div>
        <nav id="navbar" class="hidden md:flex space-x-6 font-medium">
          <a
            href="#"
            class="nav-link text-[#5E62AC] py-3 px-6 rounded-xl font-semibold bg-white"
            >Home</a
          >
          <a href="#" class="nav-link py-3 px-6 rounded-xl">About</a>
          <a href="#" class="nav-link py-3 px-6 rounded-xl">Key Services</a>
          <a href="#" class="nav-link py-3 px-6 rounded-xl">Tokenomics</a>
          <a href="#" class="nav-link py-3 px-6 rounded-xl">Roadmap</a>
        </nav>

        <a
          href="#"
          class="font-medium hidden md:inline-block px-4 py-2 border border-[#5E62AC] rounded-lg text-[#5E62AC] hover:bg-[#5E62AC] hover:text-white transition"
        >
          White Paper
        </a>
        <!-- Mobile Menu Button -->
        <button id="menu-btn" class="md:hidden text-gray-700 text-2xl">
          ☰
        </button>
      </div>

      <!-- Mobile Dropdown -->
      <div
        id="mobile-menu"
        class="hidden bg-white border-t border-gray-200 md:hidden flex flex-col px-6 py-4 space-y-3"
      >
        <a href="#" class="hover:text-indigo-600">Home</a>
        <a href="#" class="hover:text-indigo-600">About</a>
        <a href="#" class="hover:text-indigo-600">Key Services</a>
        <a href="#" class="hover:text-indigo-600">Tokenomics</a>
        <a href="#" class="hover:text-indigo-600">Roadmap</a>
        <a
          href="#"
          class="px-4 py-2 border border-indigo-600 rounded-lg text-indigo-600 hover:bg-indigo-600 hover:text-white transition"
        >
          White Paper
        </a>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="py-16">
      <div
        class="max-w-screen-xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-12 items-center"
      >
        <!-- Left Content -->
        <div class="text-center md:text-left">
          <h1
            class="text-3xl md:text-5xl font-bold leading-tight text-gray-900"
          >
            AI & Blockchain for <br />
            <span class="text-indigo-600">Digital Health Trust</span>
          </h1>
          <p class="mt-4 text-gray-600 text-lg">
            Personal Data Sovereignty, Real-World Health Utility
          </p>
          <div class="mt-6">
            <a
              href="#"
              class="px-6 py-3 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700 transition"
            >
              App Download
            </a>
          </div>
        </div>

        <!-- Right Content -->
        <div class="relative flex justify-center md:justify-end">
          <!-- Bot -->
          <img
            src="./assets/images/image_robot.png"
            alt="Bot Illustration"
            class="w-40 md:w-52 lg:w-64 z-10"
          />
        </div>
      </div>
    </section>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              notosans: ['"Noto Sans"', "sans-serif"],
            },
          },
        },
      };

      $("#menu-btn").click(function () {
        $("#mobile-menu").slideToggle();
      });

      $("#navbar .nav-link").click(function (e) {
        e.preventDefault();
        $("#navbar .nav-link").removeClass("text-[#5E62AC]");
        $("#navbar .nav-link").removeClass("bg-white");
        $("#navbar .nav-link").removeClass("font-semibold");
        $(this).addClass("text-[#5E62AC]");
        $(this).addClass("bg-white");
        $(this).addClass("font-semibold");
      });
    </script>
  </body>
</html>
